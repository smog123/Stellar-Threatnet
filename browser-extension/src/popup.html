<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #22d3ee;
    }
    p {
      font-size: 12px;
      line-height: 1.5;
      color: #94a3b8;
      margin: 4px 0;
    }
    .status {
      background: #111c33;
      border: 1px solid #1c2942;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      word-break: break-all;
    }
    a {
      color: #22d3ee;
    }
  </style>
</head>
<body>
  <h1>🛡️ Stellar ThreatNet</h1>
  <p>Phishing guard for the Stellar ecosystem. Pages are checked against the ThreatNet domain database; flagged domains show a warning banner.</p>
  <p>Data: <a href="https://github.com/stellar-threatnet/stellar-threatnet" target="_blank">open-source project</a></p>
</body>
</html>
