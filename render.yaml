services:
  - type: web
    name: stellar-threatnet-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: threatnet-db
          property: connectionString
      - key: CACHE_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: INGESTOR_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://stellar-threatnet.vercel.app","https://frontend-rosy-five-50.vercel.app","http://localhost:3000"]'

databases:
  - name: threatnet-db
    databaseName: stellar_threatnet
    user: threatnet_user
