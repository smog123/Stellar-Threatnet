[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-threatnet-sdk"
version = "0.1.0"
description = "Official Python SDK for the Stellar ThreatNet threat intelligence API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.25",
]

[tool.setuptools.packages.find]
include = ["stellar_threatnet_sdk*"]
