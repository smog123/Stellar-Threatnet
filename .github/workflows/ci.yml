name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sdk-js:
    name: JavaScript SDK (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit

  commit-messages:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const re = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps|security)(\([a-z0-9-]+\))?!?: .{1,72}$/;
            const allowed = /^(Merge |Revert |fixup! |squash! )/;
            const { execSync } = require('child_process');

            if (context.eventName === 'pull_request') {
              // PR title must follow Conventional Commits.
              const title = context.payload.pull_request.title;
              if (title && !allowed.test(title) && !re.test(title)) {
                core.setFailed(`PR title must follow Conventional Commits: "${title}". See docs/GIT_WORKFLOW.md`);
              }

              // Every non-exempt commit in the PR must follow the format.
              const base = context.payload.pull_request.base.sha;
              let log = '';
              try { log = execSync(`git log --format=%s ${base}..${context.sha}`, { encoding: 'utf8' }); } catch (e) { /* merge-base edge cases */ }
              const bad = log.split('\n').filter(Boolean).filter((l) => !allowed.test(l) && !re.test(l));
              if (bad.length) {
                core.setFailed('Non-conventional commit messages:\n' + bad.join('\n') + '\nSee docs/GIT_WORKFLOW.md');
              }
            } else {
              // Push to main: validate the head commit subject (merged PRs
              // carry the PR title, so this also guards squash merges).
              const head = execSync('git log -1 --format=%s', { encoding: 'utf8' }).trim();
              if (head && !allowed.test(head) && !re.test(head)) {
                core.setFailed('Non-conventional commit on main: ' + head + '\nSee docs/GIT_WORKFLOW.md');
              }
            }
