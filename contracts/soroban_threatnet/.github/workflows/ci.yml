name: Contract CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Soroban contract (cargo test + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
      - name: Build wasm (release)
        run: cargo build --target wasm32v1-none --release

  commit-messages:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const re = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps|security)(\([a-z0-9-]+\))?!?: .{1,72}$/;
            const allowed = /^(Merge |Revert |fixup! |squash! )/;
            const { execSync } = require('child_process');

            if (context.eventName === 'pull_request') {
              const title = context.payload.pull_request.title;
              if (title && !allowed.test(title) && !re.test(title)) {
                core.setFailed(`PR title must follow Conventional Commits: "${title}"`);
              }
              const base = context.payload.pull_request.base.sha;
              let log = '';
              try { log = execSync(`git log --format=%s ${base}..${context.sha}`, { encoding: 'utf8' }); } catch (e) { /* merge-base edge cases */ }
              const bad = log.split('\n').filter(Boolean).filter((l) => !allowed.test(l) && !re.test(l));
              if (bad.length) core.setFailed('Non-conventional commit messages:\n' + bad.join('\n'));
            } else {
              const head = execSync('git log -1 --format=%s', { encoding: 'utf8' }).trim();
              if (head && !allowed.test(head) && !re.test(head)) {
                core.setFailed('Non-conventional commit on main: ' + head);
              }
            }
